<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion & Time Interactive Quiz - StudyPy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           PREMIUM DARK NEON TECH QUIZ THEME
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(68, 202, 255, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 30%, rgba(211, 162, 111, 0.06) 0%, transparent 30%),
                        radial-gradient(circle at 50% 80%, rgba(58, 255, 98, 0.05) 0%, transparent 35%);
            animation: floatParticles 25s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        @keyframes floatParticles {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-50%, -50%);
            }
        }


        /* Quiz Container */
        .quiz-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Quiz Card - Glassmorphism */
        .quiz-card {
            background: rgba(20, 20, 35, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(68, 202, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(68, 202, 255, 0.1);
            animation: slideUp 0.8s ease-out;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Quiz Home */
        .quiz-home .quiz-card {
            padding: 50px;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .quiz-title {
            font-size: 2.5em;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fcebd2 0%, #44caff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(68, 202, 255, 0.3);
        }

        .quiz-subtitle {
            font-size: 1.1em;
            color: #a0a0b0;
            line-height: 1.6;
        }

        /* Quiz Stats */
        .quiz-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .stat-box {
            background: rgba(68, 202, 255, 0.05);
            border: 1px solid rgba(68, 202, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .stat-box:hover {
            background: rgba(68, 202, 255, 0.1);
            border-color: rgba(68, 202, 255, 0.4);
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2em;
        }

        .stat-label {
            font-size: 0.9em;
            color: #888;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #44caff;
        }

        /* Quiz Options */
        .quiz-options {
            margin: 30px 0;
            padding: 20px;
            background: rgba(20, 20, 35, 0.5);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .quiz-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 12px;
            font-size: 1.05em;
            color: #e0e0e0;
            transition: color 0.3s ease;
        }

        .quiz-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #44caff;
        }

        .quiz-checkbox:hover {
            color: #44caff;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #44caff 0%, #3a7bd5 100%);
            color: #0a0a0a;
            box-shadow: 0 4px 20px rgba(68, 202, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(68, 202, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(68, 202, 255, 0.1);
            color: #44caff;
            border: 1px solid rgba(68, 202, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(68, 202, 255, 0.2);
            border-color: rgba(68, 202, 255, 0.5);
        }

        .btn-tertiary {
            background: rgba(211, 162, 111, 0.1);
            color: #d3a26f;
            border: 1px solid rgba(211, 162, 111, 0.3);
        }

        .btn-tertiary:hover {
            background: rgba(211, 162, 111, 0.2);
            border-color: rgba(211, 162, 111, 0.5);
        }

        .btn-lg {
            padding: 16px 48px;
            font-size: 1.2em;
            width: 100%;
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.95em;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            transform: none;
            box-shadow: none;
            background: rgba(68, 202, 255, 0.1);
        }

        /* Progress Bar */
        .quiz-progress {
            margin-bottom: 30px;
        }

        .progress-bar {
            background: rgba(68, 202, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #44caff 0%, #3aff62 100%);
            height: 100%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(68, 202, 255, 0.5);
        }
        
        .progress-text {
            font-size: 0.9em;
            color: #999;
            text-align: right;
        }

        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .quiz-top-bar .quiz-progress {
            flex-grow: 1;
            margin-bottom: 0;
        }

        .btn-exit {
            background: rgba(255, 46, 87, 0.15);
            color: #ff2e57;
            border: 1px solid rgba(255, 46, 87, 0.4);
        }

        /* Question */
        .question-badge {
            display: inline-block;
            background: rgba(68, 202, 255, 0.15);
            color: #44caff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 15px;
            border: 1px solid rgba(68, 202, 255, 0.3);
        }

        .question-text {
            font-size: 1.4em;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            color: #f0f0f0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Options Container */
        .options-container {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: rgba(20, 20, 35, 0.4);
            border: 2px solid rgba(68, 202, 255, 0.2);
            color: #d0d0d0;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1em;
            font-family: 'Inter', sans-serif;
        }

        .option-btn:hover {
            background: rgba(68, 202, 255, 0.1);
            border-color: rgba(68, 202, 255, 0.5);
            transform: translateX(5px);
        }

        .option-btn.selected {
            background: rgba(68, 202, 255, 0.2);
            border-color: #44caff;
            color: #f0f0f0;
        }

        .option-btn.correct {
            background: rgba(58, 255, 98, 0.2);
            border-color: #3aff62;
            color: #3aff62;
            animation: pulse-green 0.6s ease;
        }

        .option-btn.incorrect {
            background: rgba(255, 46, 87, 0.2);
            border-color: #ff2e57;
            color: #ff2e57;
            animation: shake-red 0.5s ease;
        }

        .option-letter {
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            min-width: 30px;
        }

        .option-btn.correct .option-letter,
        .option-btn.incorrect .option-letter {
            color: inherit;
        }

        .option-text {
            flex: 1;
        }

        .option-icon {
            font-size: 1.2em;
        }

        /* Answer Explanation */
        .answer-explanation {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(211, 162, 111, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .explanation-header {
            color: #d3a26f;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .explanation-text {
            color: #e0e0e0;
            line-height: 1.6;
        }

        /* Quiz Navigation */
        .quiz-navigation {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            justify-content: space-between;
        }

        .quiz-navigation .btn {
            flex: 1;
        }

        /* Quiz Timer */
        .quiz-timer {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .quiz-timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-circle-bg {
            fill: none;
            stroke: rgba(68, 202, 255, 0.1);
            stroke-width: 8;
        }

        .timer-circle-progress {
            fill: none;
            stroke: #44caff;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 220;
            transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
        }

        .timer-circle-progress.warning {
            stroke: #ffed4e;
        }

        .timer-circle-progress.critical {
            stroke: #ff2e57;
            animation: pulse-red 1s infinite;
        }

        .timer-text {
            position: absolute;
            font-size: 1.5em;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #f0f0f0;
            transition: color 0.5s ease;
        }

        /* Results Screen */
        .quiz-results .quiz-card {
            padding: 50px;
        }

        .results-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .results-icon {
            font-size: 4em;
            margin-bottom: 20px;
            display: block;
            animation: bounce 0.8s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .results-title {
            font-size: 2.5em;
            font-family: 'Montserrat', sans-serif;
            color: #f0f0f0;
            margin-bottom: 10px;
        }

        .results-subtitle {
            font-size: 1.1em;
            color: #a0a0b0;
        }

        /* Score Circle */
        .results-score {
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }

        .score-circle {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-circle svg {
            width: 100%;
            height: 100%;
            position: absolute;
            transform: rotate(-90deg);
        }

        .score-bg {
            fill: none;
            stroke: rgba(68, 202, 255, 0.1);
            stroke-width: 8;
        }

        .score-fill {
            fill: none;
            stroke: url(#scoreGradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 283; /* 2 * PI * 45 */
            transition: stroke-dashoffset 0.8s ease;
        }

        .score-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .score-value {
            font-size: 3em;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            color: #f0f0f0;
        }

        .score-label {
            font-size: 0.9em;
            color: #a0a0b0;
            margin-top: 5px;
        }

        /* Results Stats */
        .results-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .result-stat {
            background: rgba(20, 20, 35, 0.5);
            border: 1px solid rgba(68, 202, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result-stat:hover {
            background: rgba(68, 202, 255, 0.1);
            transform: translateY(-5px);
        }

        .result-stat .stat-icon {
            font-size: 2.5em;
            display: block;
            margin-bottom: 10px;
        }

        /* Review Section */
        .results-review {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(68, 202, 255, 0.15);
        }

        .results-review h3 {
            color: #f0f0f0;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .review-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .review-item {
            background: rgba(20, 20, 35, 0.5);
            border-left: 4px solid rgba(68, 202, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .review-item.correct {
            border-left-color: #3aff62;
            background: rgba(58, 255, 98, 0.08);
        }

        .review-item.incorrect {
            border-left-color: #ff2e57;
            background: rgba(255, 46, 87, 0.08);
        }

        .review-item:hover {
            background: rgba(68, 202, 255, 0.1);
            transform: translateX(5px);
        }

        .review-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .review-number {
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #44caff;
        }

        .review-status {
            font-size: 1.1em;
        }

        .review-text {
            color: #f0f0f0;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .review-answer {
            color: #e0e0e0;
            font-size: 0.95em;
        }

        .review-correct {
            color: #3aff62;
            font-size: 0.95em;
            margin-top: 5px;
        }

        /* Quiz Actions */
        .quiz-actions {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .quiz-actions .btn {
            flex: 1;
        }

        /* AI Modal */
        .ai-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none; /* Changed to none, will be flex */
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease-out;
        }

        .ai-modal {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid rgba(68, 202, 255, 0.2);
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease-out;
        }

        .ai-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(68, 202, 255, 0.15);
            background: rgba(68, 202, 255, 0.1);
        }

        .ai-modal-header h3 {
            font-family: 'Montserrat', sans-serif;
            color: #44caff;
            font-size: 1.3em;
            margin: 0;
        }

        .ai-close {
            background: none;
            border: none;
            color: #44caff;
            font-size: 1.5em;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .ai-close:hover {
            transform: rotate(90deg);
        }

        .ai-modal-content {
            padding: 25px;
            color: #e0e0e0;
            line-height: 1.8;
        }

        .ai-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .ai-loading div {
            width: 12px;
            height: 12px;
            background-color: #44caff;
            border-radius: 50%;
            animation: ai-loader 1.2s linear infinite;
        }
        .ai-loading div:nth-child(1) { animation-delay: 0s; }
        .ai-loading div:nth-child(2) { animation-delay: -0.4s; }
        .ai-loading div:nth-child(3) { animation-delay: -0.8s; }

        @keyframes ai-loader {
            0%, 80%, 100% {
                transform: scale(0);
            } 40% {
                transform: scale(1.0);
            }
        }
        .ai-modal-content p {
            text-align: center;
        }

        .ai-modal-content p {
            margin-bottom: 15px;
        }

        .ai-modal-footer {
            padding: 20px 25px;
            border-top: 1px solid rgba(68, 202, 255, 0.15);
            display: flex;
            gap: 12px;
        }

        /* Animations */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(58, 255, 98, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(58, 255, 98, 0); }
            100% { box-shadow: 0 0 0 0 rgba(58, 255, 98, 0); }
        }

        @keyframes shake-red {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes pulse-red {
            0% {
                stroke-width: 8;
                filter: drop-shadow(0 0 3px #ff2e57);
            }
            50% {
                stroke-width: 9;
                filter: drop-shadow(0 0 6px #ff2e57);
            }
            100% {
                stroke-width: 8;
                filter: drop-shadow(0 0 3px #ff2e57);
            }
        }


        /* Responsive */
        @media (max-width: 768px) {
            .quiz-card {
                padding: 25px;
            }

            .quiz-home .quiz-card {
                padding: 30px;
            }

            .quiz-title {
                font-size: 2em;
            }

            .question-text {
                font-size: 1.2em;
            }

            .quiz-timer {
                width: 60px;
                height: 60px;
                top: 15px;
                right: 15px;
            }

            .results-stats {
                grid-template-columns: 1fr;
            }

            .quiz-actions {
                flex-direction: column;
            }

            .quiz-navigation {
                flex-direction: column;
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quiz-container"></div>
    </div>

    <!-- SVG Gradient Definition -->
    <svg style="display: none;">
        <defs>
            <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#3aff62;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#44caff;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <script src="js/quiz-motion-time.js"></script>
</body>
</html>
