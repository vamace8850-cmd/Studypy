<div class="login-modal-overlay" id="loginModalOverlay">
    <div class="login-modal-card" id="loginModalCard">
        <button class="login-modal-close" id="loginModalClose">✕</button>

        <div class="login-modal-header">
            <div class="logo-glow">
                <img src="https://i.ibb.co/YFhh9D7P/logo.png" alt="StudyPy Logo" class="new-logo-img"/>
            </div>
            <h2 class="login-modal-title">Welcome to StudyPy</h2>
            <p class="login-modal-subtitle">Unlock premium resources by logging in.</p>
        </div>

        <div class="login-modal-tabs">
            <button class="tab-btn active" data-tab="login">Login</button>
            <button class="tab-btn" data-tab="signup">Sign Up</button>
            <div class="tab-indicator"></div>
        </div>

        <div class="login-modal-body">
            <!-- Login Form -->
            <div class="login-form-container active" id="loginFormContainer">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="loginPassword" name="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember Me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-submit">Sign In 🚀</button>
                </form>
            </div>

            <!-- Signup Form -->
            <div class="login-form-container" id="signupFormContainer">
                <form id="signupForm">
                    <div class="input-group">
                        <label for="signupName">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="signupName" name="name" placeholder="Your Name" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="signupEmail">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="signupEmail" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="signupPassword">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="signupPassword" name="password" placeholder="Create a strong password" required>
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                    <div class="form-options">
                         <label class="remember-me">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#">Terms</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn-submit">Create Account ✨</button>
                </form>
            </div>
        </div>

        <div class="social-login-divider">
            <span>OR</span>
        </div>

        <div class="social-login-buttons">
            <button class="social-btn google">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21.35,11.1H12.18V13.83H18.69C18.36,17.64 15.19,19.27 12.19,19.27C8.36,19.27 5,16.25 5,12C5,7.75 8.36,4.73 12.19,4.73C15.28,4.73 17.27,6.48 17.27,6.48L19.6,4.2C19.6,4.2 16.57,2 12.19,2C6.42,2 2.03,6.8 2.03,12C2.03,17.2 6.42,22 12.19,22C17.6,22 21.7,18.35 21.7,12.33C21.7,11.7 21.52,11.4 21.35,11.1Z"></path></svg>
                <span>Sign in with Google</span>
            </button>
            <button class="social-btn instagram">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.8,2H16.2C19.4,2 22,4.6 22,7.8V16.2A5.8,5.8 0 0,1 16.2,22H7.8C4.6,22 2,19.4 2,16.2V7.8A5.8,5.8 0 0,1 7.8,2M7.6,4A3.6,3.6 0 0,0 4,7.6V16.4C4,18.39 5.61,20 7.6,20H16.4A3.6,3.6 0 0,0 20,16.4V7.6C20,5.61 18.39,4 16.4,4H7.6M17.25,5.5A1.25,1.25 0 0,1 18.5,6.75A1.25,1.25 0 0,1 17.25,8A1.25,1.25 0 0,1 16,6.75A1.25,1.25 0 0,1 17.25,5.5M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z"></path></svg>
                <span>Sign in with Instagram</span>
            </button>
        </div>

        <div class="login-modal-footer">
            <p id="footerLoginText">Don't have an account? <a href="#" data-tab="signup">Sign Up</a></p>
            <p id="footerSignupText" style="display: none;">Already have an account? <a href="#" data-tab="login">Login</a></p>
        </div>
    </div>
</div>

<div id="loginNotificationContainer"></div>
